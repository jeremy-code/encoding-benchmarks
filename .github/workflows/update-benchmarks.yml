name: Update benchmarks

on:
  workflow_dispatch:

permissions: {} # Each job defines its own permissions explicitly

jobs:
  build:
    name: Build
    permissions:
      contents: write # Access to check out and update code
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm package manager
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          install: true

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "PLAYWRIGHT_VERSION=$(pnpm view playwright version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium-headless-shell

      - name: Run benchmarks
        run: pnpm run bench --reporter json --outputFile.json=./test-output.json

      - name: Update README.md
        run: pnpm update-readme

      - name: Format with Oxfmt
        run: pnpm format

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            README.md
            test-output.json
          commit-message: "chore: sync benchmark results"
          branch: sync/benchmark
          delete-branch: true
          title: "chore: sync benchmark results"
          body: |
            ## Benchmark results updated

            *Auto-generated by the [update-benchmarks workflow](.github/workflows/update-benchmarks.yml).*
          labels: |
            automated
            benchmarks
